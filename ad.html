<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعلان في سوق العز</title>
  <meta name="description" content="غنم وماعز وإبل وأبقار في دول الخليج. افتح الإعلان في تطبيق سوق العز.">
  <meta property="og:title" content="إعلان في سوق العز">
  <meta property="og:description" content="غنم وماعز وإبل وأبقار في دول الخليج">
  <meta property="og:image" content="assets/icon.png">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/config.js"></script>
</head>
<body>
  <main class="wrap">
    <a class="brand" href="./"><img src="assets/icon.png" alt="">سوق العز</a>
    <div id="app"><p class="state">جارٍ تحميل الإعلان…</p></div>
  </main>

  <script>
    (function () {
      var S = window.SOUQ;
      var app = document.getElementById('app');
      var id = Number(new URLSearchParams(location.search).get('id'));
      var SYMBOLS = { SAR: 'ر.س', AED: 'د.إ', KWD: 'د.ك', QAR: 'ر.ق', BHD: 'د.ب', OMR: 'ر.ع' };

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function openAppUrl(adId) {
        var ua = navigator.userAgent || '';
        if (/android/i.test(ua)) {
          return 'intent://ad/' + adId + '#Intent;scheme=' + S.scheme + ';package=' + S.androidPackage +
            ';S.browser_fallback_url=' + encodeURIComponent(S.storeUrl) + ';end';
        }
        return S.scheme + '://ad/' + adId;
      }

      function price(ad) {
        if (ad.price == null) return 'على السوم';
        var n = Number(ad.price).toLocaleString('en-US', { maximumFractionDigits: 2 });
        return n + ' ' + (SYMBOLS[ad.currency_code] || ad.currency_code) + (ad.is_negotiable ? ' · قابل للتفاوض' : '');
      }

      function photoUrl(path) {
        return S.supabaseUrl + '/storage/v1/object/public/ad-media/' + path.split('/').map(encodeURIComponent).join('/');
      }

      function showMessage(text) {
        app.replaceChildren(el('p', 'state', text), actions(null));
      }

      function actions(adId) {
        var box = el('div', 'actions');
        if (adId) {
          var open = el('a', 'btn primary', 'افتح الإعلان في التطبيق');
          open.href = openAppUrl(adId);
          box.appendChild(open);
        }
        var store = el('a', 'btn ' + (adId ? 'secondary' : 'primary'), 'حمّل تطبيق سوق العز');
        store.href = S.storeUrl;
        box.appendChild(store);
        return box;
      }

      if (!id) return showMessage('رابط الإعلان غير صحيح');

      var select = 'id,title,price,is_negotiable,currency_code,quantity,status,is_udhiya,description,' +
        'city:cities(name_ar),breed:breeds(name_ar),category:categories(name_ar),media:ad_media(storage_path,sort_order)';

      window.souqFetch('ads?select=' + encodeURIComponent(select) + '&id=eq.' + id).then(function (rows) {
        var ad = rows[0];
        if (!ad) return showMessage('الإعلان غير متاح، ربما بيع أو حُذف');

        document.title = ad.title + ' | سوق العز';
        var media = (ad.media || []).slice().sort(function (a, b) { return a.sort_order - b.sort_order; });

        var card = el('article', 'card');
        if (media.length) {
          var img = el('img', 'photo');
          img.src = photoUrl(media[0].storage_path);
          img.alt = ad.title;
          card.appendChild(img);
          if (media.length > 1) {
            var thumbs = el('div', 'thumbs');
            media.forEach(function (m) {
              var t = el('img');
              t.src = photoUrl(m.storage_path);
              t.alt = '';
              t.loading = 'lazy';
              t.addEventListener('click', function () { img.src = t.src; });
              thumbs.appendChild(t);
            });
            card.appendChild(thumbs);
          }
        } else {
          card.appendChild(el('div', 'photo empty', 'لا توجد صور'));
        }

        var body = el('div', 'body');
        var pills = el('div', 'pills');
        [ad.category && ad.category.name_ar, ad.breed && ad.breed.name_ar, ad.is_udhiya ? 'مناسب للأضحية' : null,
          ad.quantity > 1 ? ad.quantity + ' رأس' : null].filter(Boolean).forEach(function (p) {
          pills.appendChild(el('span', 'pill', p));
        });
        if (pills.childNodes.length) body.appendChild(pills);
        body.appendChild(el('h1', null, ad.title));
        body.appendChild(el('div', 'price', price(ad)));
        body.appendChild(el('div', 'meta', [ad.city && ad.city.name_ar, 'إعلان رقم ' + ad.id].filter(Boolean).join(' · ')));
        if (ad.description) body.appendChild(el('p', 'desc', ad.description));
        card.appendChild(body);

        var note = el('p', 'note', 'للتواصل مع البائع افتح الإعلان في التطبيق. عاين الحلال بنفسك قبل الدفع.');
        app.replaceChildren(card, actions(ad.id), note);
      }).catch(function () {
        showMessage('تعذّر تحميل الإعلان، تأكد من الإنترنت');
      });
    })();
  </script>
</body>
</html>
